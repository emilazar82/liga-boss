name: Android-App bauen

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TB_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Spiel in die App legen
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cp version.json android/app/src/main/assets/version.json
          echo "TB_VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Test-App bauen (APK zum direkten Installieren)
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Signaturschlüssel bereitstellen
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.TB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "TB_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "vorhanden=ja" >> "$GITHUB_OUTPUT"
          else
            echo "Kein Signaturschlüssel hinterlegt: Die Store-Datei wird übersprungen."
            echo "vorhanden=nein" >> "$GITHUB_OUTPUT"
          fi

      - name: Store-Datei bauen (signiertes AAB für Google Play)
        if: steps.key.outputs.vorhanden == 'ja'
        working-directory: android
        env:
          TB_KEYSTORE_PASSWORD: ${{ secrets.TB_KEYSTORE_PASSWORD }}
          TB_KEY_ALIAS: ${{ secrets.TB_KEY_ALIAS }}
          TB_KEY_PASSWORD: ${{ secrets.TB_KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease

      - name: Test-App bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: trainerbank-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Gerätetest im Emulator: Startet die App, legt dann eine neuere Spieldatei in die App und prüft,
      # dass sie geladen wird und der Spielstand-Speicher derselbe bleibt.
      - name: Emulator vorbereiten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Gerätetest (Aktualisierung behält den Spielstand)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash android/geraetetest.sh

      - name: Store-Datei bereitstellen
        if: steps.key.outputs.vorhanden == 'ja'
        uses: actions/upload-artifact@v4
        with:
          name: trainerbank-store-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
